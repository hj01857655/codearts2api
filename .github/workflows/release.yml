name: release

# 只由 tag 触发：手动触发没有 GORELEASER_CURRENT_TAG 可用，
# 从分支跑会因为找不到 tag 失败，从已有 tag 跑会撞 asset 已存在。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # 面板是 Vue3+Vite 工程，发布前重建一次内联单文件（panel-dist 已随仓库
      # 提交作为免 Node 兜底，这里保证发布产物与 panel/ 源码一致）。
      - uses: oven-sh/setup-bun@v2
      - name: Build panel
        run: cd panel && bun install --frozen-lockfile && bun run build

      - name: Test
        run: go test ./...

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          # 固定大版本：.goreleaser.yaml 用的是 v2 语法，latest 会浮到任意新大版本。
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
