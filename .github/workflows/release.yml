name: release

# 只由 tag 触发：手动触发没有 GORELEASER_CURRENT_TAG 可用，
# 从分支跑会因为找不到 tag 失败，从已有 tag 跑会撞 asset 已存在。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # 面板产物 internal/server/dist 随仓库提交，直接进入发布物；不要在这里重建——
      # 跨平台行尾字节差会让工作区变 dirty，goreleaser 会拒绝发布。
      # 面板源码变更须本地构建后连同 internal/server/dist 一起提交。

      - name: Test
        run: go test ./...

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          # 固定大版本：.goreleaser.yaml 用的是 v2 语法，latest 会浮到任意新大版本。
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
